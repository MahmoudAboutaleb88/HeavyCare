<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeavyCare — التقارير</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link rel="stylesheet" href="assets/style.css">
<style>
  .filters-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    align-items: end;
  }
  .filters-grid .field-actions { display: flex; gap: 8px; }

  .summary-strip {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }
  .summary-strip .mini-stat {
    background: var(--color-bg);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    text-align: center;
  }
  .summary-strip .mini-stat .num { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--color-ink); }
  .summary-strip .mini-stat .lbl { font-size: 11.5px; color: var(--color-ink-muted); margin-top: 2px; }

  /* Print-friendly report header shown only inside the exported PDF */
  #reportPrintHeader { display: none; }

  @media print {
    .app-header, .no-print { display: none !important; }
    #reportPrintHeader { display: block !important; margin-bottom: 16px; }
    body { background: #fff; }
  }

  @media (max-width: 900px) {
    .filters-grid { grid-template-columns: 1fr 1fr; }
    .summary-strip { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark"><i data-lucide="wrench"></i></span>
    HeavyCare
  </div>
  <nav class="nav-pills">
    <a href="dashboard.html" class="nav-pill"><i data-lucide="gauge"></i> اللوحة</a>
    <a href="index.html" class="nav-pill"><i data-lucide="layout-grid"></i> الأقسام</a>
    <a href="equipment.html" class="nav-pill"><i data-lucide="truck"></i> المعدات</a>
    <a href="workshop-entries.html" class="nav-pill"><i data-lucide="clipboard-list"></i> دخول الورشة</a>
    <a href="reports.html" class="nav-pill active"><i data-lucide="file-text"></i> التقارير</a>
    <a href="users.html" class="nav-pill"><i data-lucide="users"></i> المستخدمين</a>
  </nav>
  <div class="session">
    <span><span class="user-name" id="userName"></span><span class="user-role" id="userRole"></span></span>
    <button type="button" id="logoutBtn" class="logout-link"><i data-lucide="log-out"></i> خروج</button>
  </div>
</header>

<main class="page page-wide">

  <div class="nameplate no-print">
    <div class="eyebrow">REPORTING · WORKSHOP ENTRIES</div>
    <h1>التقارير</h1>
    <p>فلتر البيانات حسب احتياجك — تاريخ، قسم، معدة، نوع الصيانة، أو الحالة</p>
  </div>

  <div class="card no-print">
    <h2>الفلاتر</h2>
    <div class="filters-grid">
      <div>
        <label>من تاريخ</label>
        <input type="date" id="dateFrom">
      </div>
      <div>
        <label>إلى تاريخ</label>
        <input type="date" id="dateTo">
      </div>
      <div>
        <label>الإدارة</label>
        <select id="departmentFilter"><option value="">الكل</option></select>
      </div>
      <div>
        <label>نوع الصيانة</label>
        <select id="typeFilter">
          <option value="">الكل</option>
          <option value="PM">صيانة دورية (PM)</option>
          <option value="BD">عطل (BD)</option>
        </select>
      </div>
      <div>
        <label>الحالة</label>
        <select id="statusFilter">
          <option value="">الكل</option>
          <option value="open">مفتوحة</option>
          <option value="closed">مقفولة</option>
        </select>
      </div>
    </div>
    <div style="margin-top:14px; display:flex; gap:10px;">
      <button type="button" class="btn btn-primary" id="generateBtn"><i data-lucide="search"></i> عرض التقرير</button>
      <button type="button" class="btn btn-secondary" id="resetBtn"><i data-lucide="rotate-ccw"></i> إعادة تعيين</button>
      <button type="button" class="btn btn-success" id="downloadBtn" style="margin-inline-start:auto;" disabled><i data-lucide="download"></i> تحميل PDF</button>
    </div>
    <div id="status" class="status-msg"></div>
  </div>

  <div id="reportArea" style="display:none;">
    <div id="reportPrintHeader">
      <h1 style="margin:0 0 4px; font-size:20px;">HeavyCare — تقرير ورشة المعدات</h1>
      <p id="printMeta" style="margin:0; color:#555; font-size:12px;"></p>
      <hr style="margin:12px 0; border:none; border-top:1px solid #ccc;">
    </div>

    <div class="card">
      <div class="summary-strip" id="summaryStrip"></div>

      <table class="data-table">
        <thead>
          <tr>
            <th>رقم الزيارة</th>
            <th>المعدة</th>
            <th>الإدارة</th>
            <th>النوع</th>
            <th>تاريخ الدخول</th>
            <th>تاريخ الخروج</th>
            <th>المدة</th>
            <th>الحالة</th>
            <th>التكلفة</th>
          </tr>
        </thead>
        <tbody id="reportBody"></tbody>
      </table>
    </div>
  </div>

</main>

<script>
  // ---- Auth guard ----
  const authToken = localStorage.getItem('auth_token');
  const authUserRaw = localStorage.getItem('auth_user');

  if (!authToken || !authUserRaw) {
    window.location.href = 'login.html';
    throw new Error('Not authenticated');
  }

  const authUser = JSON.parse(authUserRaw);
  document.getElementById('userName').textContent = authUser.full_name;
  document.getElementById('userRole').textContent = authUser.role;

  document.getElementById('logoutBtn').addEventListener('click', function () {
    localStorage.removeItem('auth_token');
    localStorage.removeItem('auth_user');
    window.location.href = 'login.html';
  });

  function authHeaders(extra) {
    return Object.assign({ Authorization: 'Bearer ' + authToken }, extra || {});
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  const statusEl = document.getElementById('status');
  const reportArea = document.getElementById('reportArea');
  const reportBody = document.getElementById('reportBody');
  const summaryStrip = document.getElementById('summaryStrip');
  const departmentFilter = document.getElementById('departmentFilter');
  const generateBtn = document.getElementById('generateBtn');
  const resetBtn = document.getElementById('resetBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  const typeLabels = { PM: 'صيانة دورية', BD: 'عطل' };
  const typeBadgeClass = { PM: 'badge-info', BD: 'badge-danger' };
  const statusLabels = { open: 'مفتوحة', closed: 'مقفولة' };
  const statusBadgeClass = { open: 'badge-warning', closed: 'badge-success' };

  function showStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = 'status-msg ' + (type === 'error' ? 'is-error' : type === 'ok' ? 'is-ok' : '');
  }

  async function loadDepartments() {
    try {
      const res = await fetch('/api/departments', { headers: authHeaders() });
      const body = await res.json();
      if (!body.success) return;
      departmentFilter.innerHTML = '<option value="">الكل</option>' +
        body.data.map(function (d) { return '<option value="' + d.id + '">' + escapeHtml(d.name) + '</option>'; }).join('');
    } catch (err) { /* leave default */ }
  }

  function buildQueryString() {
    const params = new URLSearchParams();
    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo = document.getElementById('dateTo').value;
    const dept = departmentFilter.value;
    const type = document.getElementById('typeFilter').value;
    const status = document.getElementById('statusFilter').value;

    if (dateFrom) params.set('date_from', dateFrom);
    if (dateTo) params.set('date_to', dateTo);
    if (dept) params.set('department_id', dept);
    if (type) params.set('maintenance_type', type);
    if (status) params.set('status', status);

    return params.toString();
  }

  async function generateReport() {
    showStatus('جاري تجهيز التقرير...', '');
    downloadBtn.disabled = true;

    try {
      const qs = buildQueryString();
      const res = await fetch('/api/reports/workshop-entries' + (qs ? '?' + qs : ''), { headers: authHeaders() });

      if (res.status === 401) {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('auth_user');
        window.location.href = 'login.html';
        return;
      }

      const body = await res.json();
      if (!body.success) {
        showStatus('خطأ: ' + body.error, 'error');
        return;
      }

      renderReport(body.data);
      showStatus('تم تجهيز التقرير (' + body.data.length + ' سجل) ✅', 'ok');
      downloadBtn.disabled = body.data.length === 0;
    } catch (err) {
      showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
    }
  }

  function renderReport(rows) {
    reportArea.style.display = 'block';

    // ---- Summary strip ----
    const totalCount = rows.length;
    const pmCount = rows.filter(function (r) { return r.maintenance_type === 'PM'; }).length;
    const bdCount = rows.filter(function (r) { return r.maintenance_type === 'BD'; }).length;
    const totalCost = rows.reduce(function (sum, r) { return sum + Number(r.labor_cost || 0) + Number(r.parts_cost || 0); }, 0);
    const closedWithDuration = rows.filter(function (r) { return r.status === 'closed'; });

    summaryStrip.innerHTML =
      '<div class="mini-stat"><div class="num">' + totalCount + '</div><div class="lbl">إجمالي السجلات</div></div>' +
      '<div class="mini-stat"><div class="num">' + pmCount + '</div><div class="lbl">صيانة دورية</div></div>' +
      '<div class="mini-stat"><div class="num">' + bdCount + '</div><div class="lbl">أعطال</div></div>' +
      '<div class="mini-stat"><div class="num">' + closedWithDuration.length + '</div><div class="lbl">زيارات مقفولة</div></div>' +
      '<div class="mini-stat"><div class="num">' + totalCost.toFixed(0) + '</div><div class="lbl">إجمالي التكلفة</div></div>';

    // ---- Table rows ----
    if (rows.length === 0) {
      reportBody.innerHTML = '<tr><td colspan="9" class="empty-row">لا يوجد سجلات مطابقة للفلاتر المختارة</td></tr>';
    } else {
      reportBody.innerHTML = rows.map(function (r) {
        const duration = r.maintenance_type === 'PM'
          ? (r.duration_hours != null ? r.duration_hours + ' ساعة' : '-')
          : (r.duration_days != null ? r.duration_days + ' يوم' : '-');
        const cost = (Number(r.labor_cost || 0) + Number(r.parts_cost || 0)).toFixed(2);

        return '<tr>' +
          '<td class="cell-mono">' + escapeHtml(r.entry_number) + '</td>' +
          '<td class="cell-mono">' + escapeHtml(r.equipment_code) + '</td>' +
          '<td>' + escapeHtml(r.department_name) + '</td>' +
          '<td><span class="badge ' + typeBadgeClass[r.maintenance_type] + '">' + typeLabels[r.maintenance_type] + '</span></td>' +
          '<td class="cell-mono">' + r.entry_date + '</td>' +
          '<td class="cell-mono">' + (r.exit_date || '-') + '</td>' +
          '<td class="cell-mono">' + duration + '</td>' +
          '<td><span class="badge ' + statusBadgeClass[r.status] + '">' + statusLabels[r.status] + '</span></td>' +
          '<td class="cell-mono">' + cost + '</td>' +
          '</tr>';
      }).join('');
    }

    // ---- Print header meta (used only in the exported PDF) ----
    const filterBits = [];
    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo = document.getElementById('dateTo').value;
    if (dateFrom || dateTo) filterBits.push('الفترة: ' + (dateFrom || '...') + ' إلى ' + (dateTo || '...'));
    const deptLabel = departmentFilter.selectedOptions[0] ? departmentFilter.selectedOptions[0].textContent : '';
    if (departmentFilter.value) filterBits.push('الإدارة: ' + deptLabel);
    filterBits.push('تم الإنشاء: ' + new Date().toLocaleString('ar-EG'));

    document.getElementById('printMeta').textContent = filterBits.join(' · ');

    if (window.lucide) lucide.createIcons();
  }

  generateBtn.addEventListener('click', generateReport);

  resetBtn.addEventListener('click', function () {
    document.getElementById('dateFrom').value = '';
    document.getElementById('dateTo').value = '';
    departmentFilter.value = '';
    document.getElementById('typeFilter').value = '';
    document.getElementById('statusFilter').value = '';
    reportArea.style.display = 'none';
    downloadBtn.disabled = true;
    showStatus('', '');
  });

  downloadBtn.addEventListener('click', function () {
    downloadBtn.disabled = true;
    downloadBtn.innerHTML = '<i data-lucide="loader"></i> جاري التجهيز...';

    const filename = 'HeavyCare-Report-' + new Date().toISOString().slice(0, 10) + '.pdf';

    html2pdf()
      .set({
        margin: 10,
        filename: filename,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
      })
      .from(reportArea)
      .save()
      .then(function () {
        downloadBtn.disabled = false;
        downloadBtn.innerHTML = '<i data-lucide="download"></i> تحميل PDF';
        if (window.lucide) lucide.createIcons();
      });
  });

  loadDepartments();
  if (window.lucide) lucide.createIcons();
</script>

</body>
</html>
