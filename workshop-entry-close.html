<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B3440">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>HeavyCare — إقفال زيارة الورشة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="assets/style.css">
<style>
  .summary {
    background: var(--color-bg);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 13px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 16px;
    font-family: var(--font-mono);
  }
  .summary strong { color: var(--color-ink); font-family: var(--font-body); }
  .loading { text-align: center; color: var(--color-ink-muted); padding: 60px 0; }
  .back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--color-ink-muted); text-decoration: none; font-size: 13px; margin-bottom: 16px; }
  .back-link svg { width: 14px; height: 14px; }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark"><i data-lucide="wrench"></i></span>
    HeavyCare
  </div>
  <nav class="nav-pills">
    <a href="equipment-cards.html" class="nav-pill"><i data-lucide="home"></i> الرئيسية</a>
    <a href="dashboard.html" class="nav-pill"><i data-lucide="gauge"></i> اللوحة</a>
    <a href="index.html" class="nav-pill"><i data-lucide="layout-grid"></i> الأقسام</a>
    <a href="equipment.html" class="nav-pill"><i data-lucide="truck"></i> إدارة المعدات</a>
    <a href="workshop-entries.html" class="nav-pill active"><i data-lucide="clipboard-list"></i> دخول الورشة</a>
      <a href="users.html" class="nav-pill"><i data-lucide="users"></i> المستخدمين</a>
    <a href="reports.html" class="nav-pill"><i data-lucide="file-text"></i> التقارير</a>
    <a href="notifications.html" class="nav-pill"><i data-lucide="bell"></i> التنبيهات<span class="notif-badge" id="notifBadge">0</span></a>
  </nav>

  <div class="global-search">
    <i data-lucide="search"></i>
    <input type="text" id="globalSearchInput" placeholder="بحث بالكود، رقم الزيارة، الاسم...">
    <div id="globalSearchResults" class="search-results"></div>
  </div>
</header>

<main class="page page-narrow">
  <a href="workshop-entries.html" class="back-link"><i data-lucide="arrow-right"></i> رجوع لدخول الورشة</a>

  <div id="loadingBox" class="loading">جاري تحميل بيانات الزيارة...</div>

  <div id="content" style="display:none;">
    <div class="nameplate">
      <div class="eyebrow">WORKSHOP OPERATIONS · EXIT LOG</div>
      <h1>إقفال زيارة الورشة</h1>
      <p>سجّل بيانات الخروج — المدة هتتحسب تلقائيًا</p>
    </div>

    <div class="card">
      <div class="summary" id="summaryBox"></div>

      <form id="closeForm">
        <div class="form-grid">
          <div>
            <label>تاريخ الخروج <span class="req">*</span></label>
            <input type="date" id="exitDate" required>
          </div>
          <div>
            <label>وقت الخروج <span class="req">*</span></label>
            <input type="time" id="exitTime" required>
          </div>

          <div class="field-full">
            <label>حالة المعدة بعد الخروج <span class="req">*</span></label>
            <select id="finalEquipmentStatus" required>
              <option value="available">تعمل بشكل طبيعي (متاحة)</option>
              <option value="breakdown">لسه معطلة</option>
            </select>
          </div>

          <div class="field-full">
            <label>نتيجة الصيانة</label>
            <textarea id="maintenanceResult" placeholder="مثال: تم استبدال الفلتر وإصلاح التسريب"></textarea>
          </div>

          <div class="field-full">
            <label>وصف حالة المعدة</label>
            <input type="text" id="equipmentCondition" placeholder="مثال: جاهزة للعمل بدون ملاحظات">
          </div>

          <div class="field-full">
            <label>ملاحظات الفني النهائية</label>
            <textarea id="finalTechnicianNotes"></textarea>
          </div>
        </div>

        <button type="submit" class="btn btn-success" id="closeBtn" style="margin-top:16px;"><i data-lucide="check-circle"></i> إقفال الزيارة</button>
      </form>

      <div id="status" class="status-msg"></div>
    </div>
  </div>
</main>

<script>
  // ---- Auth guard ----
  const authToken = localStorage.getItem('auth_token');
  const authUserRaw = localStorage.getItem('auth_user');

  if (!authToken || !authUserRaw) {
    window.location.href = 'login.html';
    throw new Error('Not authenticated');
  }

  function authHeaders(extra) {
    return Object.assign({ Authorization: 'Bearer ' + authToken }, extra || {});
  }

  function handleUnauthorized(res) {
    if (res.status === 401) {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('auth_user');
      window.location.href = 'login.html';
      return true;
    }
    return false;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  const params = new URLSearchParams(window.location.search);
  const entryId = params.get('id');

  const loadingBox = document.getElementById('loadingBox');
  const contentBox = document.getElementById('content');
  const summaryBox = document.getElementById('summaryBox');
  const statusEl = document.getElementById('status');
  const closeForm = document.getElementById('closeForm');
  const closeBtn = document.getElementById('closeBtn');

  function showStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = 'status-msg ' + (type === 'error' ? 'is-error' : type === 'ok' ? 'is-ok' : '');
  }

  const maintenanceTypeLabels = { PM: 'صيانة دورية (PM)', BD: 'عطل (BD)' };

  async function loadEntry() {
    if (!entryId) {
      loadingBox.textContent = 'رقم الزيارة غير موجود في الرابط';
      return;
    }

    try {
      const res = await fetch('/api/workshop-entries/' + entryId, { headers: authHeaders() });
      if (handleUnauthorized(res)) return;
      const body = await res.json();

      if (!body.success) {
        loadingBox.textContent = 'خطأ: ' + body.error;
        return;
      }

      const entry = body.data;

      if (entry.status === 'closed') {
        loadingBox.textContent = 'هذه الزيارة مقفولة بالفعل (رقم: ' + entry.entry_number + ')';
        return;
      }

      summaryBox.innerHTML =
        '<div><strong>رقم الزيارة:</strong> ' + escapeHtml(entry.entry_number) + '</div>' +
        '<div><strong>المعدة:</strong> ' + escapeHtml(entry.equipment_code) + '</div>' +
        '<div><strong>الإدارة:</strong> ' + escapeHtml(entry.department_name) + '</div>' +
        '<div><strong>النوع:</strong> ' + maintenanceTypeLabels[entry.maintenance_type] + '</div>' +
        '<div><strong>تاريخ الدخول:</strong> ' + entry.entry_date + ' ' + entry.entry_time + '</div>' +
        '<div><strong>المشكلة:</strong> ' + escapeHtml(entry.reported_problem) + '</div>';

      const now = new Date();
      document.getElementById('exitDate').value = now.toISOString().slice(0, 10);
      document.getElementById('exitTime').value = now.toTimeString().slice(0, 5);

      loadingBox.style.display = 'none';
      contentBox.style.display = 'block';
      if (window.lucide) lucide.createIcons();

      closeForm.addEventListener('submit', function (e) {
        handleClose(e, entry);
      });
    } catch (err) {
      loadingBox.textContent = 'تعذر الاتصال بالخادم: ' + err.message;
    }
  }

  async function handleClose(e, entry) {
    e.preventDefault();
    closeBtn.disabled = true;
    showStatus('جاري إقفال الزيارة...', '');

    const payload = {
      exit_date: document.getElementById('exitDate').value,
      exit_time: document.getElementById('exitTime').value,
      final_equipment_status: document.getElementById('finalEquipmentStatus').value,
      maintenance_result: document.getElementById('maintenanceResult').value.trim(),
      equipment_condition: document.getElementById('equipmentCondition').value.trim(),
      final_technician_notes: document.getElementById('finalTechnicianNotes').value.trim(),
    };

    try {
      const res = await fetch('/api/workshop-entries/' + entryId + '/close', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(payload),
      });
      if (handleUnauthorized(res)) return;
      const body = await res.json();

      if (!body.success) {
        showStatus('خطأ: ' + body.error, 'error');
        return;
      }

      const durationText = entry.maintenance_type === 'PM'
        ? (body.data.duration_hours + ' ساعة')
        : (body.data.duration_days + ' يوم');

      showStatus('تم إقفال الزيارة بنجاح ✅ — المدة الإجمالية: ' + durationText + '\nجاري التحويل لصفحة دخول الورشة...', 'ok');

      setTimeout(function () {
        window.location.href = 'workshop-entries.html';
      }, 1800);
    } catch (err) {
      showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
    } finally {
      closeBtn.disabled = false;
    }
  }

  loadEntry();
  if (window.lucide) lucide.createIcons();
</script>

<script src="assets/search.js"></script>
<script src="assets/notifications.js"></script>
<script src="assets/pwa.js"></script>
</body>
</html>
