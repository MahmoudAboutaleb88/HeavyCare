<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeavyCare — إدارة الأقسام</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="assets/pagination.js"></script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark"><i data-lucide="wrench"></i></span>
    HeavyCare
  </div>
  <nav class="nav-pills">
    <a href="equipment-cards.html" class="nav-pill"><i data-lucide="home"></i> الرئيسية</a>
    <a href="dashboard.html" class="nav-pill"><i data-lucide="gauge"></i> اللوحة</a>
    <a href="index.html" class="nav-pill active"><i data-lucide="layout-grid"></i> الأقسام</a>
    <a href="equipment.html" class="nav-pill"><i data-lucide="truck"></i> إدارة المعدات</a>
    <a href="workshop-entries.html" class="nav-pill"><i data-lucide="clipboard-list"></i> دخول الورشة</a>
      <a href="users.html" class="nav-pill"><i data-lucide="users"></i> المستخدمين</a>
    <a href="reports.html" class="nav-pill"><i data-lucide="file-text"></i> التقارير</a>
    <a href="notifications.html" class="nav-pill"><i data-lucide="bell"></i> التنبيهات<span class="notif-badge" id="notifBadge">0</span></a>
  </nav>

  <div class="global-search">
    <i data-lucide="search"></i>
    <input type="text" id="globalSearchInput" placeholder="بحث بالكود، رقم الزيارة، الاسم...">
    <div id="globalSearchResults" class="search-results"></div>
  </div>

  <div class="session">
    <span><span class="user-name" id="userName"></span><span class="user-role" id="userRole"></span></span>
    <button type="button" id="logoutBtn" class="logout-link"><i data-lucide="log-out"></i> خروج</button>
  </div>
</header>

<main class="page page-narrow">

  <div class="nameplate">
    <div class="eyebrow">MASTER DATA · DEPARTMENTS</div>
    <h1>إدارة الأقسام</h1>
    <p>الإدارات الأساسية اللي بتتبعها المعدات في المصنع</p>
    <div class="plate-meta">
      <div><span>إجمالي الأقسام</span><strong id="deptCount">—</strong></div>
    </div>
  </div>

  <div class="card">
    <h2>إضافة قسم جديد</h2>
    <form id="addForm" style="display:flex; gap:10px;">
      <input type="text" id="nameInput" placeholder="اسم القسم (مثال: الإنتاج)" required style="flex:1;">
      <button type="submit" id="addBtn" class="btn btn-primary"><i data-lucide="plus"></i> إضافة</button>
    </form>
    <div id="status" class="status-msg"></div>
  </div>

  <div class="card">
    <h2>الأقسام المسجّلة</h2>
    <table class="data-table">
      <thead>
        <tr><th>اسم القسم</th><th style="width:140px;">الإجراءات</th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
    <div id="deptPager" class="no-print"></div>
  </div>

</main>

<script>
  // ---- Auth guard: run before anything else on the page ----
  const authToken = localStorage.getItem('auth_token');
  const authUserRaw = localStorage.getItem('auth_user');

  if (!authToken || !authUserRaw) {
    window.location.href = 'login.html';
    throw new Error('Not authenticated');
  }

  const authUser = JSON.parse(authUserRaw);
  document.getElementById('userName').textContent = authUser.full_name;
  document.getElementById('userRole').textContent = authUser.role;

  document.getElementById('logoutBtn').addEventListener('click', function () {
    localStorage.removeItem('auth_token');
    localStorage.removeItem('auth_user');
    window.location.href = 'login.html';
  });

  function authHeaders(extra) {
    return Object.assign({ Authorization: 'Bearer ' + authToken }, extra || {});
  }

  const listEl = document.getElementById('list');
  const statusEl = document.getElementById('status');
  const formEl = document.getElementById('addForm');
  const nameInput = document.getElementById('nameInput');
  const addBtn = document.getElementById('addBtn');
  const deptCountEl = document.getElementById('deptCount');

  function showStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = 'status-msg ' + (type === 'error' ? 'is-error' : type === 'ok' ? 'is-ok' : '');
  }

  const deptPager = createPaginator(document.getElementById('deptPager'), 10, renderDeptRows);

  function renderDeptRows(pageItems) {
    listEl.innerHTML = '';

    if (pageItems.length === 0) {
      listEl.innerHTML = '<tr><td colspan="2" class="empty-row">لا يوجد أقسام مضافة بعد</td></tr>';
      return;
    }

    pageItems.forEach(function (dept) {
      const tr = document.createElement('tr');
      tr.setAttribute('data-dept-id', dept.id);
      tr.innerHTML =
        '<td class="dept-name-cell">' + escapeHtml(dept.name) + '</td>' +
        '<td>' +
          '<button type="button" class="btn-link link-edit" data-edit-id="' + dept.id + '"><i data-lucide="pencil"></i> تعديل</button> ' +
          '<button type="button" class="btn-link link-danger" data-archive-id="' + dept.id + '" data-archive-name="' + escapeHtml(dept.name) + '"><i data-lucide="archive"></i> أرشفة</button>' +
        '</td>';
      listEl.appendChild(tr);
    });

    if (window.lucide) lucide.createIcons();
  }

  async function loadDepartments() {
    showStatus('جاري التحميل...', '');
    try {
      const res = await fetch('/api/departments', { headers: authHeaders() });

      if (res.status === 401) {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('auth_user');
        window.location.href = 'login.html';
        return;
      }

      const body = await res.json();

      if (!body.success) {
        showStatus('خطأ: ' + body.error, 'error');
        return;
      }

      deptCountEl.textContent = body.data.length;
      deptPager.setItems(body.data);

      showStatus('تم التحميل بنجاح (' + body.data.length + ' قسم)', 'ok');
      if (window.lucide) lucide.createIcons();
    } catch (err) {
      showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Handle edit / archive clicks (event delegation) ----
  listEl.addEventListener('click', async function (e) {
    const target = e.target.closest('[data-edit-id], [data-archive-id], [data-save-id], [data-cancel-id]');
    if (!target) return;

    const editId = target.getAttribute('data-edit-id');
    const archiveId = target.getAttribute('data-archive-id');
    const saveId = target.getAttribute('data-save-id');
    const cancelId = target.getAttribute('data-cancel-id');

    if (editId) {
      const tr = target.closest('tr');
      const currentName = tr.querySelector('.dept-name-cell').textContent;
      tr.innerHTML =
        '<td><input type="text" class="edit-input" value="' + escapeHtml(currentName) + '" style="width:100%;"></td>' +
        '<td>' +
          '<button type="button" class="btn-link link-success" data-save-id="' + editId + '"><i data-lucide="check"></i> حفظ</button> ' +
          '<button type="button" class="btn-link link-danger" data-cancel-id="' + editId + '"><i data-lucide="x"></i> إلغاء</button>' +
        '</td>';
      tr.querySelector('.edit-input').focus();
      if (window.lucide) lucide.createIcons();
      return;
    }

    if (cancelId) {
      loadDepartments();
      return;
    }

    if (saveId) {
      const tr = target.closest('tr');
      const newName = tr.querySelector('.edit-input').value.trim();
      if (!newName) return;

      try {
        const res = await fetch('/api/departments/' + saveId, {
          method: 'PUT',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ name: newName }),
        });
        if (res.status === 401) {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('auth_user');
          window.location.href = 'login.html';
          return;
        }
        const body = await res.json();

        if (!body.success) {
          showStatus('خطأ: ' + body.error, 'error');
          return;
        }

        showStatus('تم حفظ التعديل بنجاح ✅', 'ok');
        loadDepartments();
      } catch (err) {
        showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
      }
      return;
    }

    if (archiveId) {
      const name = target.getAttribute('data-archive-name');
      const confirmed = window.confirm('هل أنت متأكد من أرشفة قسم "' + name + '"؟');
      if (!confirmed) return;

      try {
        const res = await fetch('/api/departments/' + archiveId, {
          method: 'DELETE',
          headers: authHeaders(),
        });
        if (res.status === 401) {
          localStorage.removeItem('auth_token');
          localStorage.removeItem('auth_user');
          window.location.href = 'login.html';
          return;
        }
        const body = await res.json();

        if (!body.success) {
          showStatus('خطأ: ' + body.error, 'error');
          return;
        }

        showStatus('تمت أرشفة القسم بنجاح ✅', 'ok');
        loadDepartments();
      } catch (err) {
        showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
      }
    }
  });

  formEl.addEventListener('submit', async function (e) {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) return;

    addBtn.disabled = true;
    showStatus('جاري الإضافة...', '');

    try {
      const res = await fetch('/api/departments', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ name: name }),
      });
      const body = await res.json();

      if (res.status === 401) {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('auth_user');
        window.location.href = 'login.html';
        return;
      }

      if (!body.success) {
        showStatus('خطأ: ' + body.error, 'error');
        return;
      }

      nameInput.value = '';
      showStatus('تمت الإضافة بنجاح ✅', 'ok');
      loadDepartments();
    } catch (err) {
      showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
    } finally {
      addBtn.disabled = false;
    }
  });

  loadDepartments();
  if (window.lucide) lucide.createIcons();
</script>

<script src="assets/search.js"></script>
<script src="assets/notifications.js"></script>
</body>
</html>
