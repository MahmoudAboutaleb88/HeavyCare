<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B3440">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>HeavyCare — المعدات</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="assets/upload.js"></script>
<script src="assets/pagination.js"></script>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark"><i data-lucide="wrench"></i></span>
    HeavyCare
  </div>
  <nav class="nav-pills">
    <a href="equipment-cards.html" class="nav-pill"><i data-lucide="home"></i> الرئيسية</a>
    <a href="dashboard.html" class="nav-pill"><i data-lucide="gauge"></i> اللوحة</a>
    <a href="index.html" class="nav-pill"><i data-lucide="layout-grid"></i> الأقسام</a>
    <a href="equipment.html" class="nav-pill active"><i data-lucide="truck"></i> إدارة المعدات</a>
    <a href="workshop-entries.html" class="nav-pill"><i data-lucide="clipboard-list"></i> دخول الورشة</a>
      <a href="users.html" class="nav-pill"><i data-lucide="users"></i> المستخدمين</a>
    <a href="reports.html" class="nav-pill"><i data-lucide="file-text"></i> التقارير</a>
    <a href="notifications.html" class="nav-pill"><i data-lucide="bell"></i> التنبيهات<span class="notif-badge" id="notifBadge">0</span></a>
  </nav>

  <div class="global-search">
    <i data-lucide="search"></i>
    <input type="text" id="globalSearchInput" placeholder="بحث بالكود، رقم الزيارة، الاسم...">
    <div id="globalSearchResults" class="search-results"></div>
  </div>

  <div class="session">
    <span><span class="user-name" id="userName"></span><span class="user-role" id="userRole"></span></span>
    <button type="button" id="logoutBtn" class="logout-link"><i data-lucide="log-out"></i> خروج</button>
  </div>
</header>

<main class="page page-wide">

  <div class="nameplate">
    <div class="eyebrow">MASTER DATA · EQUIPMENT</div>
    <h1 id="formTitle">تسجيل المعدات</h1>
    <p>بيانات المعدة الأساسية — الحقول المطلوبة فقط بجانبها علامة *</p>
  </div>

  <div class="card">
    <form id="addForm">
      <div class="form-grid">
        <div class="field-full" style="display:flex; align-items:center; gap:16px;">
          <div id="imagePreviewBox" style="width:72px; height:72px; border-radius:10px; background:var(--color-bg); border:1px dashed var(--color-border-strong); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;">
            <i data-lucide="image" style="color:var(--color-ink-muted);"></i>
          </div>
          <div style="flex:1;">
            <label>صورة المعدة</label>
            <input type="file" id="imageInput" accept="image/*">
            <div class="role-select-hint" id="imageHint" style="font-size:11.5px; color:var(--color-ink-muted); margin-top:4px;"></div>
          </div>
        </div>

        <div class="field-full sub-grid-2">
          <div>
            <label>كود المعدة <span class="req">*</span></label>
            <input type="text" id="code" required>
          </div>
          <div>
            <label>نوع المعدة</label>
            <input type="text" id="equipmentType" placeholder="مثال: شاحنة، رافعة، مولد">
          </div>
        </div>

        <div>
          <label>الإدارة التابع لها <span class="req">*</span></label>
          <select id="departmentId" required>
            <option value="">جاري تحميل الإدارات...</option>
          </select>
        </div>
        <div>
          <label>الماركة</label>
          <input type="text" id="brand">
        </div>

        <div>
          <label>الموديل</label>
          <input type="text" id="model">
        </div>
        <div>
          <label>رقم الأصل (Asset Number)</label>
          <input type="text" id="assetNumber">
        </div>

        <div>
          <label>سنة الصنع</label>
          <input type="number" id="manufacturingYear" min="1950" max="2100">
        </div>
        <div>
          <label>قراءة العداد الحالية</label>
          <input type="number" id="hourMeter" step="0.01" value="0">
        </div>

        <div>
          <label>تاريخ الشراء</label>
          <input type="date" id="purchaseDate">
        </div>
        <div>
          <label>تاريخ انتهاء الضمان</label>
          <input type="date" id="warrantyExpiry">
        </div>
      </div>

      <div style="margin-top:16px;">
        <button type="submit" class="btn btn-primary" id="addBtn"><i data-lucide="save"></i> تسجيل المعدة</button>
        <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display:none;"><i data-lucide="x"></i> إلغاء التعديل</button>
      </div>
    </form>

    <div id="status" class="status-msg"></div>
  </div>

  <div class="card">
    <h2>المعدات المسجّلة</h2>
    <table class="data-table">
      <thead>
        <tr>
          <th></th>
          <th>الكود</th>
          <th>النوع</th>
          <th>الإدارة</th>
          <th>الماركة / الموديل</th>
          <th>الحالة</th>
          <th>العداد</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="equipmentPager" class="no-print"></div>
  </div>

</main>

<script>
  // ---- Auth guard ----
  const authToken = localStorage.getItem('auth_token');
  const authUserRaw = localStorage.getItem('auth_user');

  if (!authToken || !authUserRaw) {
    window.location.href = 'login.html';
    throw new Error('Not authenticated');
  }

  const authUser = JSON.parse(authUserRaw);
  document.getElementById('userName').textContent = authUser.full_name;
  document.getElementById('userRole').textContent = authUser.role;

  document.getElementById('logoutBtn').addEventListener('click', function () {
    localStorage.removeItem('auth_token');
    localStorage.removeItem('auth_user');
    window.location.href = 'login.html';
  });

  function authHeaders(extra) {
    return Object.assign({ Authorization: 'Bearer ' + authToken }, extra || {});
  }

  function handleUnauthorized(res) {
    if (res.status === 401) {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('auth_user');
      window.location.href = 'login.html';
      return true;
    }
    return false;
  }

  const statusEl = document.getElementById('status');
  const tableBody = document.getElementById('tableBody');
  const departmentSelect = document.getElementById('departmentId');
  const formEl = document.getElementById('addForm');
  const addBtn = document.getElementById('addBtn');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const formTitle = document.getElementById('formTitle');
  const imageInput = document.getElementById('imageInput');
  const imagePreviewBox = document.getElementById('imagePreviewBox');
  const imageHint = document.getElementById('imageHint');

  let editingId = null;
  let currentImageUrl = null;

  function setImagePreview(url) {
    currentImageUrl = url;
    imagePreviewBox.innerHTML = url
      ? '<img src="' + url + '" style="width:100%; height:100%; object-fit:cover;">'
      : '<i data-lucide="image" style="color:var(--color-ink-muted);"></i>';
    if (window.lucide) lucide.createIcons();
  }

  imageInput.addEventListener('change', async function () {
    const file = imageInput.files[0];
    if (!file) return;

    imageHint.textContent = 'جاري رفع الصورة...';
    try {
      const url = await uploadImageToCloudinary(file);
      setImagePreview(url);
      imageHint.textContent = 'تم رفع الصورة بنجاح ✅';
    } catch (err) {
      imageHint.textContent = 'خطأ: ' + err.message;
      imageInput.value = '';
    }
  });

  function enterEditMode(eq) {
    editingId = eq.id;
    formTitle.textContent = 'تعديل المعدة: ' + eq.code;
    addBtn.innerHTML = '<i data-lucide="save"></i> حفظ التعديلات';
    cancelEditBtn.style.display = 'inline-flex';

    document.getElementById('code').value = eq.code || '';
    document.getElementById('equipmentType').value = eq.equipment_type || '';
    document.getElementById('departmentId').value = eq.department_id || '';
    document.getElementById('brand').value = eq.brand || '';
    document.getElementById('model').value = eq.model || '';
    document.getElementById('assetNumber').value = eq.asset_number || '';
    document.getElementById('manufacturingYear').value = eq.manufacturing_year || '';
    document.getElementById('hourMeter').value = eq.hour_meter || 0;
    document.getElementById('purchaseDate').value = eq.purchase_date || '';
    document.getElementById('warrantyExpiry').value = eq.warranty_expiry || '';
    setImagePreview(eq.image_url || null);
    imageHint.textContent = '';

    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (window.lucide) lucide.createIcons();
  }

  function exitEditMode() {
    editingId = null;
    formTitle.textContent = 'تسجيل المعدات';
    addBtn.innerHTML = '<i data-lucide="save"></i> تسجيل المعدة';
    cancelEditBtn.style.display = 'none';
    formEl.reset();
    document.getElementById('hourMeter').value = '0';
    setImagePreview(null);
    imageHint.textContent = '';
    if (window.lucide) lucide.createIcons();
  }

  cancelEditBtn.addEventListener('click', exitEditMode);



  const statusLabels = {
    available: 'متاحة',
    in_workshop: 'داخل الورشة',
    breakdown: 'معطلة',
    archived: 'مؤرشفة',
  };
  const statusBadgeClass = {
    available: 'badge-success',
    in_workshop: 'badge-warning',
    breakdown: 'badge-danger',
    archived: 'badge-neutral',
  };

  function showStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = 'status-msg ' + (type === 'error' ? 'is-error' : type === 'ok' ? 'is-ok' : '');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  async function loadDepartments() {
    try {
      const res = await fetch('/api/departments', { headers: authHeaders() });
      if (handleUnauthorized(res)) return;
      const body = await res.json();

      if (!body.success) {
        departmentSelect.innerHTML = '<option value="">تعذر تحميل الإدارات</option>';
        return;
      }

      if (body.data.length === 0) {
        departmentSelect.innerHTML = '<option value="">لا يوجد إدارات مسجلة بعد</option>';
        return;
      }

      departmentSelect.innerHTML = '<option value="">اختر الإدارة</option>' +
        body.data.map(function (d) {
          return '<option value="' + d.id + '">' + escapeHtml(d.name) + '</option>';
        }).join('');
    } catch (err) {
      departmentSelect.innerHTML = '<option value="">تعذر الاتصال بالخادم</option>';
    }
  }

  const equipmentPager = createPaginator(document.getElementById('equipmentPager'), 10, renderEquipmentRows);

  function renderEquipmentRows(pageItems) {
    if (pageItems.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="7" class="empty-row">لا يوجد معدات مسجلة بعد</td></tr>';
      return;
    }

    tableBody.innerHTML = pageItems.map(function (eq) {
      const brandModel = [eq.brand, eq.model].filter(Boolean).join(' / ') || '-';
      const thumb = eq.image_url
        ? '<img src="' + eq.image_url + '" style="width:36px; height:36px; border-radius:6px; object-fit:cover;">'
        : '<div style="width:36px; height:36px; border-radius:6px; background:var(--color-bg);"></div>';
      return '<tr>' +
        '<td>' + thumb + '</td>' +
        '<td class="cell-mono">' + escapeHtml(eq.code) + '</td>' +
        '<td>' + escapeHtml(eq.equipment_type || '-') + '</td>' +
        '<td>' + escapeHtml(eq.department_name) + '</td>' +
        '<td>' + escapeHtml(brandModel) + '</td>' +
        '<td><span class="badge ' + statusBadgeClass[eq.current_status] + '">' + statusLabels[eq.current_status] + '</span></td>' +
        '<td class="cell-mono">' + eq.hour_meter + '</td>' +
        '<td>' +
          '<a href="equipment-history.html?id=' + eq.id + '" class="btn-link link-edit"><i data-lucide="history"></i> السجل</a> ' +
          '<button type="button" class="btn-link link-edit" data-edit-id="' + eq.id + '"><i data-lucide="pencil"></i> تعديل</button> ' +
          '<button type="button" class="btn-link link-danger" data-archive-id="' + eq.id + '" data-archive-code="' + escapeHtml(eq.code) + '"><i data-lucide="archive"></i> أرشفة</button>' +
        '</td>' +
        '</tr>';
    }).join('');

    if (window.lucide) lucide.createIcons();
  }

  async function loadEquipment() {
    showStatus('جاري التحميل...', '');
    try {
      const res = await fetch('/api/equipment', { headers: authHeaders() });
      if (handleUnauthorized(res)) return;
      const body = await res.json();

      if (!body.success) {
        showStatus('خطأ: ' + body.error, 'error');
        return;
      }

      window.__equipmentCache = {};
      body.data.forEach(function (eq) { window.__equipmentCache[eq.id] = eq; });
      equipmentPager.setItems(body.data);

      showStatus('تم التحميل بنجاح (' + body.data.length + ' معدة)', 'ok');
      if (window.lucide) lucide.createIcons();
    } catch (err) {
      showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
    }
  }

  tableBody.addEventListener('click', async function (e) {
    const target = e.target.closest('[data-edit-id], [data-archive-id]');
    if (!target) return;
    const editId = target.getAttribute('data-edit-id');
    const archiveId = target.getAttribute('data-archive-id');

    if (editId) {
      const eq = window.__equipmentCache[editId];
      if (eq) enterEditMode(eq);
      return;
    }

    if (archiveId) {
      const code = target.getAttribute('data-archive-code');
      const confirmed = window.confirm('هل أنت متأكد من أرشفة المعدة "' + code + '"؟ لن تظهر في القوائم بعد الأرشفة.');
      if (!confirmed) return;

      try {
        const res = await fetch('/api/equipment/' + archiveId, {
          method: 'DELETE',
          headers: authHeaders(),
        });
        if (handleUnauthorized(res)) return;
        const body = await res.json();

        if (!body.success) {
          showStatus('خطأ: ' + body.error, 'error');
          return;
        }

        if (editingId === Number(archiveId)) exitEditMode();
        showStatus('تمت أرشفة المعدة بنجاح ✅', 'ok');
        loadEquipment();
      } catch (err) {
        showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
      }
    }
  });

  formEl.addEventListener('submit', async function (e) {
    e.preventDefault();
    addBtn.disabled = true;
    showStatus(editingId ? 'جاري حفظ التعديلات...' : 'جاري التسجيل...', '');

    const payload = {
      code: document.getElementById('code').value.trim(),
      department_id: document.getElementById('departmentId').value,
      equipment_type: document.getElementById('equipmentType').value.trim(),
      brand: document.getElementById('brand').value.trim(),
      model: document.getElementById('model').value.trim(),
      asset_number: document.getElementById('assetNumber').value.trim(),
      manufacturing_year: document.getElementById('manufacturingYear').value,
      hour_meter: document.getElementById('hourMeter').value,
      purchase_date: document.getElementById('purchaseDate').value,
      warranty_expiry: document.getElementById('warrantyExpiry').value,
      image_url: currentImageUrl,
    };

    const url = editingId ? '/api/equipment/' + editingId : '/api/equipment';
    const method = editingId ? 'PUT' : 'POST';

    try {
      const res = await fetch(url, {
        method: method,
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(payload),
      });
      if (handleUnauthorized(res)) return;
      const body = await res.json();

      if (!body.success) {
        showStatus('خطأ: ' + body.error, 'error');
        return;
      }

      const wasEditing = !!editingId;
      exitEditMode();
      showStatus(wasEditing ? 'تم حفظ التعديلات بنجاح ✅' : 'تم تسجيل المعدة بنجاح ✅', 'ok');
      loadEquipment();
    } catch (err) {
      showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
    } finally {
      addBtn.disabled = false;
    }
  });

  loadDepartments();
  loadEquipment();
  if (window.lucide) lucide.createIcons();
</script>

<script src="assets/search.js"></script>
<script src="assets/notifications.js"></script>
<script src="assets/pwa.js"></script>
</body>
</html>
