<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeavyCare — دخول الورشة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="assets/style.css">
<style>
  .maintenance-toggle { display: flex; gap: 10px; }
  .maintenance-toggle label {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 12px;
    border: 1.5px solid var(--color-border-strong);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    margin: 0;
  }
  .maintenance-toggle input { width: auto; }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark"><i data-lucide="wrench"></i></span>
    HeavyCare
  </div>
  <nav class="nav-pills">
    <a href="index.html" class="nav-pill"><i data-lucide="layout-grid"></i> الأقسام</a>
    <a href="equipment.html" class="nav-pill"><i data-lucide="truck"></i> المعدات</a>
    <a href="workshop-entries.html" class="nav-pill active"><i data-lucide="clipboard-list"></i> دخول الورشة</a>
  </nav>
  <div class="session">
    <span><span class="user-name" id="userName"></span><span class="user-role" id="userRole"></span></span>
    <button type="button" id="logoutBtn" class="logout-link"><i data-lucide="log-out"></i> خروج</button>
  </div>
</header>

<main class="page page-wide">

  <div class="nameplate">
    <div class="eyebrow">WORKSHOP OPERATIONS · ENTRY LOG</div>
    <h1>تسجيل دخول معدة للورشة</h1>
    <p>اختر معدة مسجّلة بالفعل — المعدات الداخل الورشة حاليًا مش هتظهر في القائمة</p>
  </div>

  <div class="card">
    <form id="addForm">
      <div class="form-grid">
        <div class="field-full">
          <label>المعدة <span class="req">*</span></label>
          <select id="equipmentId" required>
            <option value="">جاري تحميل المعدات...</option>
          </select>
        </div>

        <div class="field-full">
          <label>نوع الصيانة <span class="req">*</span></label>
          <div class="maintenance-toggle">
            <label><input type="radio" name="maintenanceType" value="PM" checked> صيانة دورية (PM) — المعدة شغالة</label>
            <label><input type="radio" name="maintenanceType" value="BD"> عطل (BD) — المعدة متوقفة</label>
          </div>
        </div>

        <div>
          <label>الإدارة <span class="req">*</span></label>
          <select id="departmentId" required>
            <option value="">جاري تحميل الإدارات...</option>
          </select>
        </div>
        <div>
          <label>الأولوية</label>
          <select id="priority">
            <option value="low">منخفضة</option>
            <option value="medium" selected>متوسطة</option>
            <option value="high">عالية</option>
            <option value="critical">حرجة</option>
          </select>
        </div>

        <div>
          <label>السائق / المشغّل</label>
          <input type="text" id="driverOperator">
        </div>
        <div>
          <label>قراءة العداد وقت الدخول</label>
          <input type="number" id="hourMeterAtEntry" step="0.01">
        </div>

        <div class="field-full">
          <label>المشكلة المُبلّغ عنها <span class="req">*</span></label>
          <textarea id="reportedProblem" required></textarea>
        </div>

        <div class="field-full">
          <label>التشخيص المبدئي (اختياري)</label>
          <textarea id="initialDiagnosis"></textarea>
        </div>

        <div class="field-full">
          <label>ملاحظات</label>
          <textarea id="notes"></textarea>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="addBtn" style="margin-top:16px;"><i data-lucide="log-in"></i> تسجيل الدخول للورشة</button>
    </form>

    <div id="status" class="status-msg"></div>
  </div>

  <div class="card">
    <h2>المعدات الموجودة داخل الورشة حاليًا</h2>
    <table class="data-table">
      <thead>
        <tr>
          <th>رقم الزيارة</th>
          <th>المعدة</th>
          <th>الإدارة</th>
          <th>النوع</th>
          <th>الأولوية</th>
          <th>الحالة</th>
          <th>تاريخ الدخول</th>
          <th>الإجراءات</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</main>

<script>
  // ---- Auth guard ----
  const authToken = localStorage.getItem('auth_token');
  const authUserRaw = localStorage.getItem('auth_user');

  if (!authToken || !authUserRaw) {
    window.location.href = 'login.html';
    throw new Error('Not authenticated');
  }

  const authUser = JSON.parse(authUserRaw);
  document.getElementById('userName').textContent = authUser.full_name;
  document.getElementById('userRole').textContent = authUser.role;

  document.getElementById('logoutBtn').addEventListener('click', function () {
    localStorage.removeItem('auth_token');
    localStorage.removeItem('auth_user');
    window.location.href = 'login.html';
  });

  function authHeaders(extra) {
    return Object.assign({ Authorization: 'Bearer ' + authToken }, extra || {});
  }

  function handleUnauthorized(res) {
    if (res.status === 401) {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('auth_user');
      window.location.href = 'login.html';
      return true;
    }
    return false;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  const statusEl = document.getElementById('status');
  const tableBody = document.getElementById('tableBody');
  const equipmentSelect = document.getElementById('equipmentId');
  const departmentSelect = document.getElementById('departmentId');
  const formEl = document.getElementById('addForm');
  const addBtn = document.getElementById('addBtn');

  function showStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = 'status-msg ' + (type === 'error' ? 'is-error' : type === 'ok' ? 'is-ok' : '');
  }

  let equipmentCache = {};

  async function loadEquipmentOptions() {
    try {
      const res = await fetch('/api/equipment', { headers: authHeaders() });
      if (handleUnauthorized(res)) return;
      const body = await res.json();

      if (!body.success) {
        equipmentSelect.innerHTML = '<option value="">تعذر تحميل المعدات</option>';
        return;
      }

      const available = body.data.filter(function (eq) { return eq.current_status !== 'in_workshop'; });
      equipmentCache = {};
      available.forEach(function (eq) { equipmentCache[eq.id] = eq; });

      if (available.length === 0) {
        equipmentSelect.innerHTML = '<option value="">كل المعدات المسجلة موجودة بالفعل داخل الورشة</option>';
        return;
      }

      equipmentSelect.innerHTML = '<option value="">اختر المعدة</option>' +
        available.map(function (eq) {
          return '<option value="' + eq.id + '" data-dept="' + eq.department_id + '">' +
            escapeHtml(eq.code) + (eq.equipment_type ? ' — ' + escapeHtml(eq.equipment_type) : '') +
            '</option>';
        }).join('');
    } catch (err) {
      equipmentSelect.innerHTML = '<option value="">تعذر الاتصال بالخادم</option>';
    }
  }

  equipmentSelect.addEventListener('change', function () {
    const selectedOption = equipmentSelect.selectedOptions[0];
    const deptId = selectedOption ? selectedOption.getAttribute('data-dept') : '';
    if (deptId) departmentSelect.value = deptId;
  });

  async function loadDepartmentOptions() {
    try {
      const res = await fetch('/api/departments', { headers: authHeaders() });
      if (handleUnauthorized(res)) return;
      const body = await res.json();

      if (!body.success || body.data.length === 0) {
        departmentSelect.innerHTML = '<option value="">لا يوجد إدارات مسجلة</option>';
        return;
      }

      departmentSelect.innerHTML = '<option value="">اختر الإدارة</option>' +
        body.data.map(function (d) {
          return '<option value="' + d.id + '">' + escapeHtml(d.name) + '</option>';
        }).join('');
    } catch (err) {
      departmentSelect.innerHTML = '<option value="">تعذر الاتصال بالخادم</option>';
    }
  }

  const priorityLabels = { low: 'منخفضة', medium: 'متوسطة', high: 'عالية', critical: 'حرجة' };
  const priorityBadgeClass = { low: 'badge-neutral', medium: 'badge-warning', high: 'badge-warning', critical: 'badge-danger' };
  const typeBadgeClass = { PM: 'badge-info', BD: 'badge-danger' };
  const progressLabels = {
    waiting: 'في الانتظار', inspection: 'جاري الفحص', repairing: 'جاري الإصلاح',
    waiting_spare_parts: 'انتظار قطع غيار', testing: 'اختبار', completed: 'مكتملة',
    delivered: 'تم التسليم', cancelled: 'ملغاة',
  };

  async function loadOpenEntries() {
    showStatus('جاري التحميل...', '');
    try {
      const res = await fetch('/api/workshop-entries?status=open', { headers: authHeaders() });
      if (handleUnauthorized(res)) return;
      const body = await res.json();

      if (!body.success) {
        showStatus('خطأ: ' + body.error, 'error');
        return;
      }

      if (body.data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="8" class="empty-row">لا يوجد معدات داخل الورشة حاليًا</td></tr>';
      } else {
        tableBody.innerHTML = body.data.map(function (entry) {
          return '<tr>' +
            '<td class="cell-mono">' + escapeHtml(entry.entry_number) + '</td>' +
            '<td class="cell-mono">' + escapeHtml(entry.equipment_code) + '</td>' +
            '<td>' + escapeHtml(entry.department_name) + '</td>' +
            '<td><span class="badge ' + typeBadgeClass[entry.maintenance_type] + '">' + entry.maintenance_type + '</span></td>' +
            '<td><span class="badge ' + priorityBadgeClass[entry.priority] + '">' + priorityLabels[entry.priority] + '</span></td>' +
            '<td>' + (progressLabels[entry.progress_status] || '-') + '</td>' +
            '<td class="cell-mono">' + entry.entry_date + ' ' + entry.entry_time + '</td>' +
            '<td>' +
              (entry.status === 'open' ? '<a href="workshop-entry-close.html?id=' + entry.id + '" class="btn-link link-success"><i data-lucide="log-out"></i> إقفال</a> ' : '') +
              '<a href="job-card.html?id=' + entry.job_card_id + '" class="btn-link link-edit"><i data-lucide="file-text"></i> بطاقة الشغل</a>' +
            '</td>' +
            '</tr>';
        }).join('');
      }

      showStatus('تم التحميل بنجاح (' + body.data.length + ' زيارة مفتوحة)', 'ok');
      if (window.lucide) lucide.createIcons();
    } catch (err) {
      showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
    }
  }

  formEl.addEventListener('submit', async function (e) {
    e.preventDefault();
    addBtn.disabled = true;
    showStatus('جاري التسجيل...', '');

    const maintenanceType = document.querySelector('input[name="maintenanceType"]:checked').value;

    const payload = {
      equipment_id: equipmentSelect.value,
      maintenance_type: maintenanceType,
      department_id: departmentSelect.value,
      priority: document.getElementById('priority').value,
      driver_operator: document.getElementById('driverOperator').value.trim(),
      hour_meter_km_at_entry: document.getElementById('hourMeterAtEntry').value,
      reported_problem: document.getElementById('reportedProblem').value.trim(),
      technician_initial_diagnosis: document.getElementById('initialDiagnosis').value.trim(),
      notes: document.getElementById('notes').value.trim(),
    };

    try {
      const res = await fetch('/api/workshop-entries', {
        method: 'POST',
        headers: authHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(payload),
      });
      if (handleUnauthorized(res)) return;
      const body = await res.json();

      if (!body.success) {
        showStatus('خطأ: ' + body.error, 'error');
        return;
      }

      formEl.reset();
      showStatus('تم تسجيل الدخول للورشة بنجاح ✅ رقم الزيارة: ' + body.data.entry_number, 'ok');
      loadEquipmentOptions();
      loadOpenEntries();
    } catch (err) {
      showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
    } finally {
      addBtn.disabled = false;
    }
  });

  loadEquipmentOptions();
  loadDepartmentOptions();
  loadOpenEntries();
  if (window.lucide) lucide.createIcons();
</script>

</body>
</html>
