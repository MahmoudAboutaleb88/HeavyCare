<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B3440">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>HeavyCare — إعداد أول حساب مدير</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="assets/style.css">
<style>
  body {
    background: linear-gradient(160deg, var(--color-steel) 0%, #1B222C 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .setup-shell { width: 100%; max-width: 420px; }
  .setup-card {
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    padding: 32px 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    border-top: 4px solid var(--color-amber);
  }
  .setup-card h1 { font-size: 18px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .setup-card p.sub { color: var(--color-ink-muted); font-size: 13px; margin: 0 0 22px; }
  .setup-card .btn { width: 100%; margin-top: 18px; justify-content: center; }
  .setup-card label { margin-top: 14px; }
</style>
</head>
<body>

<div class="setup-shell">
  <div class="setup-card">
    <h1><i data-lucide="shield-check"></i> إعداد أول حساب مدير</h1>
    <p class="sub">استخدم الصفحة دي مرة واحدة بس. بعد إنشاء أول حساب، الصفحة دي مش هتشتغل تاني (محمية تلقائيًا).</p>

    <form id="setupForm">
      <label>المفتاح السري (Setup Key)</label>
      <input type="password" id="setupKey" required>

      <label>الاسم الكامل</label>
      <input type="text" id="fullName" required>

      <label>اسم المستخدم (Username)</label>
      <input type="text" id="username" required>

      <label>كلمة السر (8 أحرف على الأقل)</label>
      <input type="password" id="password" minlength="8" required>

      <button type="submit" id="submitBtn" class="btn btn-success"><i data-lucide="user-plus"></i> إنشاء الحساب</button>
    </form>

    <div id="status" class="status-msg"></div>
  </div>
</div>

<script>
  const formEl = document.getElementById('setupForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  function showStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = 'status-msg ' + (type === 'error' ? 'is-error' : type === 'ok' ? 'is-ok' : '');
  }

  formEl.addEventListener('submit', async function (e) {
    e.preventDefault();
    submitBtn.disabled = true;
    showStatus('جاري الإنشاء...', '');

    try {
      const res = await fetch('/api/auth/setup-admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          setup_key: document.getElementById('setupKey').value,
          full_name: document.getElementById('fullName').value,
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const body = await res.json();

      if (!body.success) {
        showStatus('خطأ: ' + body.error, 'error');
        return;
      }

      showStatus('تم إنشاء الحساب بنجاح ✅\nتقدر دلوقتي تفتح صفحة login.html وتسجل دخول.', 'ok');
      formEl.reset();
    } catch (err) {
      showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
    } finally {
      submitBtn.disabled = false;
    }
  });

  if (window.lucide) lucide.createIcons();
</script>

<script src="assets/pwa.js"></script>
</body>
</html>
