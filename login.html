<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HeavyCare — تسجيل الدخول</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="assets/style.css">
<style>
  body {
    background: linear-gradient(160deg, var(--color-steel) 0%, #1B222C 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-shell { width: 100%; max-width: 380px; }
  .login-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #fff;
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 24px;
  }
  .login-brand .brand-mark {
    width: 38px; height: 38px; border-radius: 9px;
    background: var(--color-amber); color: var(--color-steel);
    display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    padding: 32px 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    border-top: 4px solid var(--color-amber);
  }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card p.sub { color: var(--color-ink-muted); font-size: 13px; margin: 0 0 22px; }
  .login-card .btn { width: 100%; margin-top: 18px; justify-content: center; }
  .login-card label { margin-top: 14px; }
</style>
</head>
<body>

<div class="login-shell">
  <div class="login-brand">
    <span class="brand-mark"><i data-lucide="wrench"></i></span>
    HeavyCare
  </div>

  <div class="login-card">
    <h1>تسجيل الدخول</h1>
    <p class="sub">نظام إدارة ورشة المعدات</p>

    <form id="loginForm">
      <label>اسم المستخدم</label>
      <input type="text" id="username" required>

      <label>كلمة السر</label>
      <input type="password" id="password" required>

      <button type="submit" id="loginBtn" class="btn btn-primary"><i data-lucide="log-in"></i> دخول</button>
    </form>

    <div id="status" class="status-msg"></div>
  </div>
</div>

<script>
  const formEl = document.getElementById('loginForm');
  const statusEl = document.getElementById('status');
  const loginBtn = document.getElementById('loginBtn');

  function showStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = 'status-msg ' + (type === 'error' ? 'is-error' : type === 'ok' ? 'is-ok' : '');
  }

  formEl.addEventListener('submit', async function (e) {
    e.preventDefault();
    loginBtn.disabled = true;
    showStatus('جاري تسجيل الدخول...', '');

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const body = await res.json();

      if (!body.success) {
        showStatus('خطأ: ' + body.error, 'error');
        return;
      }

      localStorage.setItem('auth_token', body.data.token);
      localStorage.setItem('auth_user', JSON.stringify(body.data.user));

      showStatus('تم تسجيل الدخول بنجاح ✅ جاري التحويل...', 'ok');

      setTimeout(function () {
        window.location.href = 'equipment-cards.html';
      }, 600);
    } catch (err) {
      showStatus('تعذر الاتصال بالخادم: ' + err.message, 'error');
    } finally {
      loginBtn.disabled = false;
    }
  });

  if (window.lucide) lucide.createIcons();
</script>

</body>
</html>
